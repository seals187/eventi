<!doctype html><meta charset="utf-8">
<!-- Test-only helper (never shipped): loads ?src= in a frame (?w= x ?h=) and clicks ?click= once it exists -->
<style>html,body{margin:0;background:#333}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
const p = new URLSearchParams(location.search), f = document.getElementById("f");
f.style.width = (p.get("w") || 1280) + "px"; f.style.height = (p.get("h") || 800) + "px";
f.src = p.get("src");
const timer = setInterval(() => { const el = f.contentDocument && f.contentDocument.querySelector(p.get("click")); if (el) { clearInterval(timer); el.click(); } }, 200);
</script>
