# Release automation
#   tag v*       -> build + publish the Docker image (ghcr.io/seals187/eventi:<version>, :<major>.<minor>, :latest),
#                   then create the GitHub release (latest) with the CHANGELOG.md section as notes
#   push to main -> create GitHub releases for any v* tags that do not have one yet (e.g. tags pushed
#                   before this automation existed) and mark the highest version as latest
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: EVENTI_VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh "$GITHUB_REF_NAME" latest

  sync-releases:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing releases for existing tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(git tag -l 'v*' --sort=version:refname)
          newest=$(echo "$tags" | tail -1)
          for tag in $tags; do
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            if [ "$tag" = "$newest" ]; then bash .github/scripts/release.sh "$tag" latest
            else bash .github/scripts/release.sh "$tag" old; fi
          done
          # Make sure the highest version is the one shown as "Latest"
          [ -n "$newest" ] && gh release edit "$newest" --latest
